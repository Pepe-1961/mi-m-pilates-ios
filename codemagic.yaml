workflows:
  ios-release:
    name: Mi M Pilates - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "es.mpilates.app"
        XCODE_WORKSPACE: "src/Mi M Pilates.xcworkspace"
        XCODE_SCHEME: "Mi M Pilates"
        APP_STORE_APPLE_ID: 6831267981
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decodificar assets binarios (.b64 -> binario real)
        script: |
          set -e
          find src -type f -name "*.b64" -print0 | while IFS= read -r -d '' b64file; do
            outfile="${b64file%.b64}"
            python3 -c "import base64,sys; open(sys.argv[2],'wb').write(base64.b64decode(open(sys.argv[1],'rb').read()))" "$b64file" "$outfile"
            rm "$b64file"
            echo "Decodificado: $outfile"
          done
      - name: Instalar dependencias de CocoaPods
        script: |
          set -e
          cd src
          pod install
      - name: Inicializar el llavero (keychain) de firma
        script: |
          set -e
          keychain initialize
      - name: Obtener o crear certificado y perfil de aprovisionamiento
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Añadir el certificado al llavero
        script: |
          set -e
          keychain add-certificates
      - name: Configurar firma automatica de Xcode
        script: |
          set -e
          xcode-project use-profiles
      - name: Incrementar numero de build
        script: |
          set -e
          cd src
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Compilar y archivar la app (.ipa)
        script: |
          set -e
          cd src
          xcode-project build-ipa \
            --workspace "Mi M Pilates.xcworkspace" \
            --scheme "Mi M Pilates"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
